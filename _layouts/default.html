<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <!-- Thư viện hỗ trợ hiển thị công thức toán LaTeX (MathJax) -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

  <style>
  /* 1. Biến toàn bộ trang web thành Dark Mode */
  body {
    background-color: #0d1117 !important; /* Nền xám đen chuẩn GitHub */
    color: #c9d1d9 !important; /* Chữ văn bản màu xám sáng dễ đọc */
  }

  /* 2. Ép màu trắng cho các tiêu đề (tránh bị dính màu xanh lá/đen của theme cũ) */
  h1, h2, h3, h4, h5, h6 {
    color: #ffffff !important;
  }

  /* 3. Font Consolas cho mọi loại code */
  code, pre {
    font-family: Consolas, "Courier New", monospace !important;
  }
  
  /* 4. Chỉnh inline code (như basis[60]) to hơn, màu trung tính chuẩn Dark Mode */
  p code, li code, table code {
    font-size: 1.15em !important; /* Phóng to chữ lên 115% */
    color: #e6edf3 !important; /* Chữ màu sáng */
    background-color: #161b22 !important; /* Nền xám nhạt ôm lấy chữ */
    padding: 3px 6px !important; 
    border-radius: 5px !important;
    border: 1px solid #30363d !important; /* Thêm đường viền mờ cho khối code sắc nét */
  }
  </style>
  
  <head>
    <meta charset="UTF-8">
    <title>{{ page.title | default: site.title }} | {{ site.description }}</title>
    <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#157878">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
      /* CSS cho thanh Menu nằm ở dưới */
      .nav-menu { 
        margin-top: 25px;
        padding: 12px 0; 
        text-align: center; 
        background: rgba(0, 0, 0, 0.15);
        border-radius: 6px;
      }
      .nav-menu a { 
        color: white; 
        text-decoration: none; 
        padding: 8px 18px; 
        font-weight: bold; 
        margin: 0 4px; 
        border-radius: 4px;
        transition: background 0.2s;
      }
      .nav-menu a:hover { 
        background: rgba(255, 255, 255, 0.25); 
      }
    </style>
  </head>
  <body>
    <section class="page-header">
      <!-- 1. Tên trang web -->
      <h1 class="project-name">Sổ tay của orain</h1>
      
      <!-- 2. Slogan / Mô tả -->
      <h2 class="project-tagline">Nơi lưu trữ niềm đam mê lập trình thi đấu</h2>
      
      <!-- 3. Thanh Menu nằm bên dưới -->
      <div class="nav-menu">
        <a href="{{ '/' | relative_url }}">Giới thiệu</a>
        <a href="{{ '/Posts/BaiViet.html' | relative_url }}">Bài viết</a>
        <a href="{{ '/LienHe.html' | relative_url }}">Liên hệ</a>
      </div>
    </section>

    <section class="main-content">
      {{ content }}

      <footer class="site-footer">
        <span class="site-footer-credits">© orain. Tất cả nội dung được lưu trữ trên GitHub Pages.</span>
      </footer>
    </section>
  </body>
</html>
