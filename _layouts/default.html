<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <!-- Thư viện hỗ trợ hiển thị công thức toán LaTeX (MathJax) -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

  <style>
    /* --- 1. Cài đặt gốc cho toàn trang --- */
    body, html {
      background-color: #0d1117 !important; 
      color: #c9d1d9 !important; 
    }
  
    /* --- 2. XÓA SẠCH KHUNG VIỀN BAO NGOÀI TẤT CẢ --- */
    /* Nhắm vào các thẻ bọc (container/wrapper) để xóa cái viền to bao quanh 3 card */
    div, section, article, main, .container, .wrapper, .grid, .row {
      border: none !important; 
      outline: none !important;
      box-shadow: none !important;
    }
  
    /* --- 3. Chỉnh Card: Nền xám đen, bo góc mềm mại --- */
    .card, div[class*="card"], div[class*="item"], div[class*="box"] {
      background-color: #161b22 !important; 
      border-radius: 8px !important;
      border: 1px solid #30363d !important; /* Trả lại một viền xám cực mỏng của GitHub xịn để tách biệt card, nếu bạn không thích có thể đổi thành "none !important" */
      padding: 20px !important; /* Tạo khoảng trống cho chữ thở */
    }
  
    /* --- 4. CHỮ TÓM TẮT THUẬT TOÁN SÁNG VÀ RÕ NÉT --- */
    /* Ép tất cả các đoạn văn (thẻ p) bên trong card phải là màu xám sáng, tắt hiệu ứng mờ */
    .card p, div[class*="card"] p, .summary, .description {
      color: #c9d1d9 !important; /* Đổi thành màu xám sáng */
      font-size: 1.05em !important; /* Cho chữ to lên một chút xíu cho dễ đọc */
      opacity: 1 !important; /* Tắt hiệu ứng làm mờ chữ của theme cũ */
      font-weight: 400 !important;
    }
  
    /* --- 5. Tinh chỉnh basis[60] nhỏ gọn --- */
    code, pre {
      font-family: Consolas, "Courier New", monospace !important;
    }
    p code, li code, table code {
      font-size: 0.9em !important; 
      color: #e6edf3 !important;
      background-color: rgba(110, 118, 129, 0.4) !important; 
      padding: 2px 5px !important; 
      border-radius: 6px !important;
      border: none !important; 
    }
  
    /* --- 6. Nút bấm & Tiêu đề --- */
    .btn, button, a.btn {
      background-color: #238636 !important; 
      color: #ffffff !important;
      border: none !important;
    }
    h1, h2, h3, h4, h5, h6 {
      color: #ffffff !important; 
    }
    
    /* --- 7. Các tag ghi chú (Số học, Đồ thị) --- */
    .badge, .tag, span[class*="badge"], span[class*="tag"] {
      background-color: #0d1117 !important; /* Nền đen tệp với trang */
      color: #58a6ff !important; /* Chữ xanh dương sáng kiểu GitHub */
      border: 1px solid #30363d !important; /* Viền mỏng tinh tế */
      padding: 2px 10px !important;
      border-radius: 20px !important;
    }
  </style>
  
  <head>
    <meta charset="UTF-8">
    <title>{{ page.title | default: site.title }} | {{ site.description }}</title>
    <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#157878">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
    /* CSS cho thanh Menu nằm ở dưới */
    /* --- Thanh Menu căn giữa dùng Flexbox --- */
      .nav-menu { 
        margin-top: 25px;
        padding: 10px 0; 
        display: flex;                  /* Dùng flexbox giúp căn chỉnh pixel-perfect */
        justify-content: center;        /* Căn toàn bộ menu ra chính giữa */
        align-items: center;
        gap: 12px;                      /* Khoảng cách ĐỀU NHAU 100% giữa các nút */
        background: rgba(0, 0, 0, 0.15);
        border-radius: 6px;
      }
    
      /* --- Định dạng từng nút bấm bằng nhau --- */
      .nav-menu a { 
        color: white; 
        text-decoration: none; 
        width: 110px;                   /* Ép cả 3 nút rộng ĐÚNG 110px bằng nhau */
        padding: 8px 0;                 /* Chiều cao chuẩn đều cho cả 3 nút */
        text-align: center;             /* Căn chữ nằm chính giữa từng khung */
        font-weight: bold; 
        border-radius: 6px;
        transition: all 0.2s ease;
        display: inline-block;
      }
    
      /* --- Nút đang active (đang ở trang đó) --- */
      .nav-menu a.active { 
        background: rgba(255, 255, 255, 0.25) !important; 
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
      }
    
      /* --- Hiệu ứng rê chuột --- */
      .nav-menu a:hover:not(.active) { 
        background: rgba(255, 255, 255, 0.12); 
      }
    </style>
  </head>
  <body>
    <section class="page-header">
      <!-- 1. Tên trang web -->
      <h1 class="project-name">Sổ tay của orain</h1>
      
      <!-- 2. Slogan / Mô tả -->
      <h2 class="project-tagline">Nơi lưu trữ niềm đam mê lập trình thi đấu</h2>

      <!-- 3. Thanh Menu nằm bên dưới (Tự động sáng khi chọn trang) -->
      <div class="nav-menu">
        <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">Giới thiệu</a>
        <a href="{{ '/Posts/BaiViet.html' | relative_url }}" class="{% if page.url contains 'BaiViet' or page.url contains 'Posts' or page.url contains 'post' %}active{% endif %}">Bài viết</a>
        <a href="{{ '/LienHe.html' | relative_url }}" class="{% if page.url contains 'LienHe' %}active{% endif %}">Liên hệ</a>
      </div>
    
    </section>

    <section class="main-content">
      {{ content }}

      <footer class="site-footer">
        <span class="site-footer-credits">© orain. Tất cả nội dung được lưu trữ trên GitHub Pages.</span>
      </footer>
    </section>
  </body>
</html>
